<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
        :root {
            --bg: #f3f9f6;
            --panel: #ffffff;
            --green: #16a34a;
            --green-soft: #dcfce7;
            --text: #111827;
            --muted: #4b5563;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5faf7, #edfdf5);
            color: var(--text);
        }

        .card {
            width: min(92vw, 480px);
            background: var(--panel);
            border: 1px solid rgba(22, 163, 74, 0.15);
            box-shadow: 0 20px 45px rgba(16, 185, 129, 0.12);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: var(--green-soft);
            color: var(--green);
        }

        .tag {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--green);
            font-weight: 700;
        }

        h1 {
            margin: 14px 0 10px;
            font-size: 2.2rem;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        button {
            margin-top: 24px;
            border: 0;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-weight: 700;
            padding: 12px 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="32" height="32"
                aria-hidden="true">
                <path d="M3 12c2.5-2.5 5.7-3.8 9-3.8 3.3 0 6.5 1.3 9 3.8" />
                <path d="M5.6 15.6c1.9-1.9 4.1-2.9 6.4-2.9 2.3 0 4.5 1 6.4 2.9" />
                <path d="M8.2 19.2c1.2-1.2 2.6-1.8 3.8-1.8 1.2 0 2.6.6 3.8 1.8" />
                <circle cx="12" cy="20.5" r="1.2" fill="currentColor" stroke="none" />
            </svg>
        </div>
        <div class="tag">Connection lost</div>
        <h1>Offline</h1>
        <p>You are offline right now. Please reconnect your internet and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
</body>

</html>
